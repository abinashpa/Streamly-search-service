syntax = "proto3";

package user;
option go_package = "streamly/proto/user;userproto";

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message UserMessage {
  string id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string bio = 5;
  string avatar_url = 6;
  string banner_url = 7;
  int64 subscribers = 8;
  string created_at = 9;
}

message GetUserRequest {
  string id = 1;
}

message UserResponse {
  UserMessage user = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
}
