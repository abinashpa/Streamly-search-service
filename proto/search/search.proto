syntax = "proto3";

package search;
option go_package = "streamly/proto/search;searchproto";

service SearchService {
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc Suggest (SuggestRequest) returns (SuggestResponse);
  rpc IndexMedia (IndexMediaRequest) returns (IndexMediaResponse);
  rpc DeleteIndex (DeleteIndexRequest) returns (DeleteIndexResponse);
  rpc ReindexAll (ReindexAllRequest) returns (ReindexAllResponse);
}

message SearchMediaDoc {
  string id = 1;
  string title = 2;
  string description = 3;
  string media_type = 4;
  string artist = 5;
  double duration = 6;
  string stream_url = 7;
  string thumbnail_url = 8;
  string uploader_id = 9;
  string uploader_name = 10;
  string tags = 11;
  string created_at = 12;
}

message SearchRequest {
  string query = 1;
  string media_type = 2;
  int32 page = 3;
  int32 limit = 4;
}

message SearchResponse {
  int32 total = 1;
  int32 took = 2;
  int32 page = 3;
  int32 limit = 4;
  repeated SearchMediaDoc items = 5;
}

message SuggestRequest {
  string query = 1;
  int32 limit = 2;
}

message SuggestResponse {
  repeated string suggestions = 1;
}

message IndexMediaRequest {
  SearchMediaDoc document = 1;
}

message IndexMediaResponse {
  bool success = 1;
  string id = 2;
}

message DeleteIndexRequest {
  string id = 1;
}

message DeleteIndexResponse {
  bool success = 1;
  string id = 2;
}

message ReindexAllRequest {}

message ReindexAllResponse {
  int32 indexed = 1;
  string message = 2;
}
