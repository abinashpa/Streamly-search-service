syntax = "proto3";

package media;
option go_package = "streamly/proto/media;mediaproto";

service MediaService {
  rpc GetMedia (GetMediaRequest) returns (MediaResponse);
  rpc ListMedia (ListMediaRequest) returns (ListMediaResponse);
  rpc DeleteMedia (DeleteMediaRequest) returns (DeleteMediaResponse);
}

message GetMediaRequest {
  string id = 1;
}

message ListMediaRequest {
  string media_type = 1;
  string uploader_id = 2;
  int32 limit = 3;
}

message MediaMessage {
  string id = 1;
  string title = 2;
  string description = 3;
  string media_type = 4;
  string artist = 5;
  double duration = 6;
  string stream_url = 7;
  string thumbnail_url = 8;
  string mime_type = 9;
  int64 file_size = 10;
  string uploader_id = 11;
  string uploader_name = 12;
  string tags = 13;
  string status = 14;
  string created_at = 15;
}

message MediaResponse {
  MediaMessage media = 1;
}

message ListMediaResponse {
  repeated MediaMessage items = 1;
  int32 count = 2;
}

message DeleteMediaRequest {
  string id = 1;
}

message DeleteMediaResponse {
  bool success = 1;
  string message = 2;
}
